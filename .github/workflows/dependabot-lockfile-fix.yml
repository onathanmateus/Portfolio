name: Dependabot lockfile fix

# O Dependabot só mexe nos pacotes que está atualizando, nunca nas dependências
# transitivas. Quando um pacote passa a exigir um peer mais novo (o HeroUI faz
# isso com o react-aria), o package-lock.json sai incoerente e o `npm ci` do CI
# quebra com ERESOLVE — o PR nunca passa e fica parado.
#
# Este workflow destrava esses PRs: traz o branch para cima da main, regenera o
# lock, roda o CI e, passando, faz o squash-merge e apaga o branch. Se a falha
# for outra (teste, build, Lighthouse), não mexe em nada e avisa no PR. A lógica
# fica em .github/scripts/dependabot-lockfix.sh.
on:
  # Assim que o CI de um PR do Dependabot falha.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Rede de segurança diária: pega PR em conflito com a main, merge que não
  # aconteceu ou evento perdido.
  schedule:
    - cron: "17 12 * * *"
  # Manual, para destravar um PR específico na hora.
  workflow_dispatch:
    inputs:
      pr:
        description: "Número do PR do Dependabot (vazio = todos os abertos)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

# Um de cada vez: duas correções em paralelo brigariam pela main.
concurrency:
  group: dependabot-lockfix
  cancel-in-progress: false

jobs:
  lockfix:
    name: Destravar PRs do Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]' &&
        startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Destravar os PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          PR_INPUT: ${{ inputs.pr }}
          RUN_URL_ESTE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Roda uma cópia: o script troca de branch e o original some do disco
        # nos branches antigos.
        run: |
          cp .github/scripts/dependabot-lockfix.sh "$RUNNER_TEMP/lockfix.sh"
          bash "$RUNNER_TEMP/lockfix.sh"
